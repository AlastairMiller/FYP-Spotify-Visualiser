version: "3"
services:
    mongo:
        image: mongo:latest
        environment:
          - MONGODB_USER=mongo
          - MONGODB_PASS=mongo
          - MONGODB_DATABASE=spotify
        network_mode: "host"
        ports:
         - "27017:27017"
    spotify-visualiser-ingest:
        image: alastairmiller-docker-spotify-visualiser.bintray.io/com.sv.svi/spotify-visualiser-ingest:1.0.2
        network_mode: "host"
         
networks:
    default:
       external:
         name: host
    