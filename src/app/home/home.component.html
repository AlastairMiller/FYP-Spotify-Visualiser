<div class="text-white py-1 bg-primary">
  <div class="container">
    <div class="row">
      <div class="col-md-12 mt-3 text-center">
        <div id='wordcloud'>
          <p>{{currentTrack.name}}</p>
          <p>{{currentTrack.durationMs / 1000}}</p>
          <p>{{currentTracksAlbum.name}}</p>
          <p>Popularity: {{currentTrack.popularity}}%</p>
          <p>{{currentTrack.previewURL}}</p>
          <li *ngFor = "let trackArtist of currentTracksArtists">
            {{trackArtist.name}}
          </li>
        </div>
      </div>
    </div>
  </div>
</div>
