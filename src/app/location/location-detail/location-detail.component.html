<div class="text-white bg-dark w-100  p-5"
     style="background-image: url(&quot;/assets/bgd04.jpg&quot;); background-position: center center; background-size: cover; background-repeat: no-repeat;">
  <div class="container-fluid">
    <div class="row">
      <div class="col col-auto" style="padding-left: 10%; padding-top: 5%;">
        <h1 [innerHTML]="currentCountry"></h1>
      </div>
    </div>
    <div class="row">
      <div class="col col-auto" style="padding-top: 50px">
        <table class="table table-sm table-bordered">
          <thead class="thead-dark" style="font-size: 24pt; text-indent: 10%"
                 *ngIf="currentCountryPlaylists !== undefined">Cities
          </thead>
          <tbody>
          <tr scope="row" *ngFor="let location of currentCountryPlaylists" style="font-size: 16pt; text-indent: 10%">
            <th><a href="{{location.externalURL}}">{{location.name}}</a></th>
          </tbody>
        </table>
      </div>

      <div class="col col-6">
        <div class="container" style="padding-bottom: 10%">
          <table class="table table-sm table-bordered">
            <thead class="thead-dark">
            <app-basic-chart [input]="mostPopularTrackIdMaps" title="Popular Tracks"></app-basic-chart>
            </thead>
          </table>
        </div>
      </div>

      <div class="col col-3">
        <table class="table table-sm table-bordered">
          <thead class="thead-dark" style="font-size: 18pt; text-indent: 10%">Most Popular Tracks</thead>
          <tr scope="row" *ngFor="let refinedTrack of mostPopularTracksHere">
            <th>{{refinedTrack.name}}</th>
          </tr>
        </table>
      </div>
    </div>


    <div class="row">
      <div class="col col-6">
        <table class="table table-sm table-bordered">
          <thead class="thead-dark">
          <app-basic-chart [input]="mostPopularGenreMaps" title="Popular Genres"></app-basic-chart>
          </thead>
        </table>
      </div>
      <div class="col col-2">
      </div>
      <div class="col col-3">
        <table class="table table-sm table-bordered">
          <thead class="thead-dark" style="font-size: 18pt; text-indent: 10%">Most Popular Artists</thead>
          <tr scope="row" *ngFor="let refinedArtist of mostPopularArtistsHere">
            <th>{{refinedArtist.name}}</th>
          </tr>
        </table>
      </div>
    </div>


  </div>
</div>
