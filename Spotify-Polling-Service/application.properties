logging.level.org.springframework.web=ERROR
logging.pattern.file= "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
logging.file=target/visualiser.log

server.port=8080

clientId=80ec9eda3fcc43c8b6a02e584c0c4645
clientSecret=REDACTED
redirectURI=http://localhost:8088/callback

spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2

endpoints.enabled=false
endpoints.info.enabled=true
endpoints.health.enabled=true

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.tomcat.max-active=10
spring.datasource.tomcat.max-idle=8
spring.datasource.tomcat.max-wait=10000
spring.datasource.tomcat.min-evictable-idle-time-millis=1000
spring.datasource.tomcat.min-idle=8
spring.datasource.tomcat.time-between-eviction-runs-millis=1

flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=none